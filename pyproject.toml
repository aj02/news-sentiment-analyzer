[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-sentiment-analyzer"
version = "0.1.0"
description = "Production-style news sentiment analyzer service. Fetches articles or RSS feeds, extracts structured sentiment + entities + key claims via LLM, returns clean JSON."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ajay Tambe" }]
keywords = ["nlp", "sentiment-analysis", "llm", "fastapi", "anthropic", "openai"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.12.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.4",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Repository = "https://github.com/aj02/news-sentiment-analyzer"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return
    "PL",   # pylint
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value
    "E501",     # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit real Redis or network",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
